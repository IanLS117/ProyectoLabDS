<ui:composition template="/WEB-INF/templates/principal.xhtml"
                xmlns="http://www.w3.org/1999/xhtml"
                xmlns:ui="jakarta.faces.facelets" xmlns:h="jakarta.faces.html"
                xmlns:f="jakarta.faces.core" xmlns:p="http://primefaces.org/ui">
    <ui:define name="metadata">
        <f:metadata><f:viewAction action="#{misTicketsUI.cargar}"/></f:metadata>
    </ui:define>
    <ui:define name="titulo">Mis tickets</ui:define>
    <ui:define name="contenido">
        <h:form id="formMisTickets">
            <p:messages id="mensajes" showDetail="false"/>
            <section class="panel">
                <p>Consulta las incidencias que has registrado y su estado actual. Las más recientes aparecen primero.</p>
                <div class="actions">
                    <p:commandButton value="Actualizar" icon="pi pi-refresh"
                                     action="#{misTicketsUI.cargar}" process="@this" update="@form"/>
                    <h:link outcome="/nuevo-ticket" value="Registrar ticket" styleClass="button"/>
                </div>
                <h:panelGroup layout="block" rendered="#{misTicketsUI.cargaCorrecta}">
                    <p:dataTable id="tablaTickets" value="#{misTicketsUI.tickets}" var="ticket"
                                 rowKey="#{ticket.idTicket}" reflow="true"
                                 paginator="true" rows="10" paginatorPosition="bottom"
                                 emptyMessage="Aún no has registrado tickets.">
                        <p:column headerText="Folio"><h:outputText value="#{ticket.folio}"/></p:column>
                        <p:column headerText="Equipo"><h:outputText value="#{ticket.equipo.numeroInventario}"/></p:column>
                        <p:column headerText="Tipo de incidencia"><h:outputText value="#{ticket.tipoIncidencia.nombre}"/></p:column>
                        <p:column headerText="Problema reportado"><h:outputText value="#{ticket.descripcion}"/></p:column>
                        <p:column headerText="Fecha de registro">
                            <h:outputText value="#{ticket.fechaCreacion}">
                                <f:convertDateTime type="localDateTime" pattern="dd/MM/yyyy HH:mm"/>
                            </h:outputText>
                        </p:column>
                        <p:column headerText="Estado actual"><h:outputText value="#{ticket.estado}" styleClass="badge"/></p:column>
                    </p:dataTable>
                </h:panelGroup>
            </section>
        </h:form>
    </ui:define>
</ui:composition>
