<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:p="http://primefaces.org/ui">

<h:head>
    <title>Iniciar sesión | SIGETI</title>
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0"/>

    <h:outputStylesheet name="login.css"/>
</h:head>

<h:body>
    <header class="encabezado">
        <strong>SIGETI</strong>
        <span>Sistema de tickets</span>
    </header>

    <main class="contenedor">
        <section class="tarjeta" aria-labelledby="titulo-login">
            <h1 id="titulo-login">Iniciar sesión</h1>
            <p class="descripcion">
                Ingresa tu RFC y contraseña para acceder al sistema.
            </p>

            <h:form id="formLogin">
                <p:messages id="mensajes"
                            showDetail="true"
                            closable="true"/>

                <div class="campo">
                    <p:outputLabel for="rfc" value="RFC"/>

                    <p:inputText id="rfc"
                                 value="#{loginUI.rfc}"
                                 placeholder="Ingresa tu RFC"
                                 maxlength="13"
                                 autocomplete="username"
                                 required="true"
                                 requiredMessage="Ingresa tu RFC."
                                 styleClass="entrada"/>
                </div>

                <div class="campo">
                    <p:outputLabel for="contrasena"
                                   value="Contraseña"/>

                    <p:password id="contrasena"
                                value="#{loginUI.contrasena}"
                                placeholder="Ingresa tu contraseña"
                                autocomplete="current-password"
                                feedback="false"
                                redisplay="false"
                                required="true"
                                requiredMessage="Ingresa tu contraseña."
                                styleClass="entrada"/>
                </div>

                <p:commandButton value="Iniciar sesión"
                                 action="#{loginUI.login}"
                                 ajax="false"
                                 styleClass="boton-login"/>
            </h:form>
        </section>
    </main>
</h:body>

</html>
