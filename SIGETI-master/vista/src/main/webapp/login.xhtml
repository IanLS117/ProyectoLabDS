<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:h="jakarta.faces.html" xmlns:p="http://primefaces.org/ui">
<h:head>
    <title>Iniciar sesión | SIGETI</title>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <h:outputStylesheet name="sigeti.css"/>
</h:head>
<h:body>
    <header class="topbar"><div><span class="brand">SIGETI</span><span class="subtitle">Sistema de tickets</span></div></header>
    <main class="page login-page">
        <section class="panel">
            <h1>Iniciar sesión</h1>
            <p>Ingresa tu RFC y contraseña para acceder a las opciones de tu rol.</p>
            <h:form id="formLogin">
                <p:messages showDetail="false"/>
                <div class="field">
                    <p:outputLabel for="rfc" value="RFC"/>
                    <p:inputText id="rfc" value="#{loginUI.rfc}" maxlength="13" autocomplete="username" required="true" requiredMessage="Ingresa tu RFC."/>
                </div>
                <div class="field">
                    <p:outputLabel for="contrasena" value="Contraseña"/>
                    <p:password id="contrasena" value="#{loginUI.contrasena}" autocomplete="current-password" feedback="false" redisplay="false" required="true" requiredMessage="Ingresa tu contraseña."/>
                </div>
                <p:commandButton value="Iniciar sesión" action="#{loginUI.login}" ajax="false"/>
            </h:form>
        </section>
    </main>
</h:body>
</html>
