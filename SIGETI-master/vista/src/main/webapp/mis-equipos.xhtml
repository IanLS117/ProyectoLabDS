<ui:composition template="/WEB-INF/templates/principal.xhtml" xmlns="http://www.w3.org/1999/xhtml" xmlns:ui="jakarta.faces.facelets" xmlns:h="jakarta.faces.html" xmlns:f="jakarta.faces.core" xmlns:p="http://primefaces.org/ui">
    <ui:define name="metadata"><f:metadata><f:viewAction action="#{equipoUI.cargar}"/></f:metadata></ui:define>
    <ui:define name="titulo">Mis equipos</ui:define>
    <ui:define name="contenido">
        <p:messages showDetail="false"/>
        <section class="panel">
            <p>Estos son los equipos que tienes asignados en resguardo.</p>
            <h:panelGroup rendered="#{equipoUI.cargaCorrecta}">
                <p:dataTable value="#{equipoUI.equipos}" var="equipo" emptyMessage="No tienes equipos asignados. Solicita la actualización de tu resguardo." reflow="true">
                    <p:column headerText="Número de inventario"><h:outputText value="#{equipo.numeroInventario}"/></p:column>
                    <p:column headerText="Marca"><h:outputText value="#{equipo.marca}"/></p:column>
                    <p:column headerText="Modelo"><h:outputText value="#{equipo.modelo}"/></p:column>
                    <p:column headerText="Área"><h:outputText value="#{equipo.areaAsignada}"/></p:column>
                    <p:column headerText="Estado"><h:outputText value="#{equipo.estadoHardware}"/></p:column>
                </p:dataTable>
            </h:panelGroup>
            <div class="actions">
                <h:link outcome="/nuevo-ticket" value="Registrar una incidencia" styleClass="button" rendered="#{equipoUI.cargaCorrecta and not empty equipoUI.equipos and loginUI.usuario.tienePermiso('crear_ticket')}"/>
            </div>
        </section>
    </ui:define>
</ui:composition>
