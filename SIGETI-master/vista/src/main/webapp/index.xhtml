<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:p="http://primefaces.org/ui">

<h:head>
    <title>Inicio | SIGETI</title>

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0"/>

    <h:outputStylesheet name="login.css"/>
    <h:outputStylesheet name="inicio.css"/>
</h:head>

<h:body>
    <header class="encabezado encabezado-inicio">
        <div>
            <strong>SIGETI</strong>
            <span>Sistema de tickets</span>
        </div>

        <h:form id="formSalir">
            <p:commandButton value="Cerrar sesión"
                             action="#{loginUI.cerrarSesion}"
                             ajax="false"
                             styleClass="boton-salir"/>
        </h:form>
    </header>

    <main class="contenedor">
        <section class="tarjeta tarjeta-inicio">
            <h1>
                Bienvenido,
                <h:outputText value="#{loginUI.usuario.nombre}"/>
            </h1>

            <p class="descripcion">
                Has iniciado sesión en SIGETI.
            </p>

            <h2>Datos de tu cuenta</h2>

            <dl class="datos-cuenta">
                <dt>RFC</dt>
                <dd>
                    <h:outputText value="#{loginUI.usuario.rfc}"/>
                </dd>

                <dt>Nombre completo</dt>
                <dd>
                    <h:outputText
                            value="#{loginUI.usuario.nombre} #{loginUI.usuario.apellidos}"/>
                </dd>

                <dt>Correo</dt>
                <dd>
                    <h:outputText value="#{loginUI.usuario.correo}"/>
                </dd>

                <dt>Rol</dt>
                <dd>
                    <h:outputText
                            value="#{loginUI.usuario.rol.nombreRol}"/>
                </dd>
            </dl>
            <h:panelGroup layout="block"
                          rendered="#{loginUI.usuario.tienePermiso('atender_tickets')}">
                <h2>Opciones disponibles</h2>
                <h:link outcome="/seguimientos" value="Atender tickets"/>
            </h:panelGroup>
        </section>
    </main>
</h:body>

</html>
